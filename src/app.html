<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns/website">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />


	<!-- svelte:head is not inserted during prerendering, for some reason. -->
	<link rel="preload" href="/bg.webp" as="image" />
	<link rel="preload" href="/fonts/coiny.woff2" type="font/woff2" as="font" crossorigin="anonymous" />
	<link rel="preload" href="/fonts/neue_medium.woff" type="font/woff" as="font" crossorigin="anonymous" />

	<title>Journey Hacks 2025</title>
	<meta name="description" content="Journey Hacks 2025, hosted by SFU Surge" />


	<!-- open graph -->
	<meta property="og:site_name" content="sfusurge.com" />
	<meta property="article:author" content="https://sfusurge.com" />
	<meta property="article:publisher" content="https://sfusurge.com" />
	<meta property="og:type" content="article" />

	<meta property="og:title" content="Journey Hacks 2025" />
	<meta property="og:description"
		content="Start cooking in your coding career with JourneyHacks 2025! This beginner focused hackathon at SFU Burnaby serves up the perfect blend of creativity, collaboration, and coding, helping you whip up your first project with support from mentors and workshops." />
	<meta property="og:image" content="/DisplayGraphic.webp" />
	<meta property="og:url" content="https://journeyhacks.sfusurge.com" />
	<meta property="og:image:type" content="image/webp" />
	<meta property="og:image:width" content="600" />
	<meta property="og:image:height" content="400" />
	<meta property="og:image:alt" content="Journey hacks" />


<!-- twitter card specs -->
<meta name="twitter:card" content="summary_large_image"></meta>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
